# Tech Brief publication (Sunday, 20:00 America/New_York, with fallbacks).
# Locate artifact -> verify provenance -> decrypt -> revalidate -> prepare the
# public edition -> commit to main -> verify the live Insights pages.
#
# Off by default: the publish job runs only when the repository variable
# TECH_BRIEF_AUTOMATION is "enabled" (schedules and manual dispatches) or
# "manual" (manual dispatches only); automation.mjs checks the state again and
# also requires refs/heads/main and an approved sources.json.
# The job needs the tech-brief-publish environment (TECH_BRIEF_ARTIFACT_KEY
# only, never the OpenAI key). It pushes one commit to main without force; if
# branch protection refuses that push the run fails and nothing is published.
# Supervised publication (TECH_BRIEF_AUTOMATION "manual"): approved_digest must
# be the content digest of the editorial preview the editor approved
# (tech-brief-preview.yml); any other content is refused and needs a new review.

name: Tech Brief publication

on:
  schedule:
    - cron: "7 20 * * 0"
      timezone: "America/New_York"
    - cron: "37 22 * * 0"
      timezone: "America/New_York"
    - cron: "7 7 * * 1"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      edition:
        description: "Recovery only: Saturday edition (YYYY-MM-DD); empty for the current edition"
        required: false
        default: ""
      approved_digest:
        description: "Supervised publication: the content digest of the approved editorial preview"
        required: false
        default: ""

permissions: {}

concurrency:
  group: tech-brief
  cancel-in-progress: false

jobs:
  publish:
    if: vars.TECH_BRIEF_AUTOMATION == 'enabled' || (vars.TECH_BRIEF_AUTOMATION == 'manual' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: tech-brief-publish
    permissions:
      contents: write
      actions: read
    outputs:
      status: ${{ steps.prepare.outputs.status }}
      edition: ${{ steps.plan.outputs.edition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tech-brief-ledger
          path: ledger
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: plan
        env:
          TECH_BRIEF_AUTOMATION: ${{ vars.TECH_BRIEF_AUTOMATION }}
          EDITION: ${{ inputs.edition }}
        run: node scripts/tech-brief/automation.mjs plan-publication --content-dir src/content/tech-brief --edition "$EDITION"
      - id: resolve
        if: steps.plan.outputs.run == 'production'
        env:
          EDITION: ${{ steps.plan.outputs.edition }}
        run: node scripts/tech-brief/automation.mjs resolve --ledger-dir ledger --edition "$EDITION"
      - name: Fetch the artifact and run-attempt records
        if: steps.plan.outputs.run == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.resolve.outputs.artifact_id }}
          RUN_ID: ${{ steps.resolve.outputs.workflow_run_id }}
          RUN_ATTEMPT: ${{ steps.resolve.outputs.run_attempt }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT" > "$RUNNER_TEMP/run.json"
      - if: steps.plan.outputs.run == 'production'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact_id }}
          run-id: ${{ steps.resolve.outputs.workflow_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bundle
          digest-mismatch: error
      - id: prepare
        if: steps.plan.outputs.run == 'production'
        env:
          EDITION: ${{ steps.plan.outputs.edition }}
          TECH_BRIEF_AUTOMATION: ${{ vars.TECH_BRIEF_AUTOMATION }}
          APPROVED_DIGEST: ${{ inputs.approved_digest }}
          TECH_BRIEF_ARTIFACT_KEY: ${{ secrets.TECH_BRIEF_ARTIFACT_KEY }}
          TECH_BRIEF_ARTIFACT_KEY_PREVIOUS: ${{ secrets.TECH_BRIEF_ARTIFACT_KEY_PREVIOUS }}
        run: |
          node scripts/tech-brief/automation.mjs sunday-prepare --ledger-dir ledger --edition "$EDITION" \
            --artifact-json "$RUNNER_TEMP/artifact.json" --run-json "$RUNNER_TEMP/run.json" \
            --bundle-dir "$RUNNER_TEMP/bundle" --content-dir src/content/tech-brief --repo-dir . \
            --approved-digest "$APPROVED_DIGEST"
      - name: Commit and push the public edition
        if: steps.prepare.outputs.status == 'prepared'
        env:
          EDITION: ${{ steps.plan.outputs.edition }}
          TECH_BRIEF_AUTOMATION: ${{ vars.TECH_BRIEF_AUTOMATION }}
          APPROVED_DIGEST: ${{ inputs.approved_digest }}
        run: |
          node scripts/tech-brief/automation.mjs check-changes --repo-dir . --edition "$EDITION" --approved-digest "$APPROVED_DIGEST"
          git add src/content/tech-brief/latest.json "src/content/tech-brief/editions/$EDITION.json"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish Tech Brief edition $EDITION"
          git push origin HEAD:main
      - name: Restore the content folder after a failure
        if: failure()
        run: git checkout -- src/content/tech-brief && git clean -fd -- src/content/tech-brief

  verify-live:
    needs: publish
    if: needs.publish.outputs.status == 'prepared'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - env:
          EDITION: ${{ needs.publish.outputs.edition }}
        run: node scripts/tech-brief/automation.mjs verify-live --edition "$EDITION"

  alert:
    needs: [publish, verify-live]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "Tech Brief publication run failed" --body "Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID needs attention. The previous edition stays live unless the push succeeded."
